<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Donaton Dashboard</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="sidebar">

    <h2>Donaton</h2>

    <a href="/">Dashboard</a>
    <a href="/donaciones-web">Donaciones</a>

</div>

<div class="main">

    <div class="topbar">

        <h1>Panel Administrativo</h1>

        <p>
            Plataforma inteligente para la gestión y coordinación
            de ayuda humanitaria.
        </p>

    </div>

    <!-- CARDS -->

    <div class="cards">

        <div class="card">
            <h3>Total Donaciones</h3>

            <p th:text="${totalDonaciones}"></p>
        </div>

        <div class="card">
            <h3>Usuarios Registrados</h3>

            <p th:text="${totalUsuarios}"></p>
        </div>

        <div class="card">
            <h3>Productos en Inventario</h3>

            <p th:text="${totalProductos}"></p>
        </div>

    </div>

    <!-- TABLA -->

    <div class="table-container">

        <h2>Últimas Donaciones</h2>

        <table>

            <thead>

            <tr>
                <th>ID</th>
                <th>Donante</th>
                <th>Tipo</th>
                <th>Cantidad</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="d : ${donaciones}">

                <td th:text="${d.id}"></td>

                <td th:text="${d.donante}"></td>

                <td th:text="${d.tipo}"></td>

                <td th:text="${d.cantidad}"></td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
