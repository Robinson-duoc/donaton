```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Donatón | Inventario</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding:40px;
}

.container{

max-width:1300px;

margin:auto;

}

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:35px;

}

.header h1{

color:#0a3d62;

}

.volver{

background:#0a3d62;

color:white;

text-decoration:none;

padding:12px 20px;

border-radius:10px;

}

/* ALERTAS */

.error{

background:#ffe3e3;

color:#d63031;

padding:14px;

border-radius:10px;

margin-bottom:20px;

}

.exito{

background:#dff9e6;

color:#27ae60;

padding:14px;

border-radius:10px;

margin-bottom:20px;

}

/* GRID */

.grid{

display:grid;

grid-template-columns:
420px 1fr;

gap:25px;

}

/* CARD */

.card{

background:white;

border-radius:20px;

padding:30px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

}

/* FORM */

.form-group{

margin-bottom:20px;

}

label{

display:block;

margin-bottom:8px;

font-weight:bold;

}

input,
select{

width:100%;

padding:14px;

border:1px solid #ddd;

border-radius:10px;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:10px;

background:#f0ad00;

font-size:16px;

font-weight:bold;

cursor:pointer;

}

button:hover{

background:#d89c00;

}

/* TABLA */

table{

width:100%;

border-collapse:collapse;

}

th{

background:#0a3d62;

color:white;

}

th,
td{

padding:14px;

text-align:center;

border-bottom:1px solid #eee;

}

tr:hover{

background:#fafafa;

}

.badge{

padding:8px 14px;

border-radius:20px;

font-size:13px;

font-weight:bold;

display:inline-block;

}

.alimentos{

background:#d4edda;

color:#155724;

}

.abrigo{

background:#d1ecf1;

color:#0c5460;

}

.higiene{

background:#fff3cd;

color:#856404;

}

.otros{

background:#ececec;

color:#555;

}

.empty{

padding:40px;

text-align:center;

color:#777;

}

@media(max-width:900px){

.grid{

grid-template-columns:1fr;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>

📦 Control de Inventario

</h1>

<a
th:href="@{/}"
class="volver">

← Inicio

</a>

</div>



<div
th:if="${error}"
class="error"
th:text="${error}">
</div>

<div
th:if="${param.exito}"
class="exito">

✅ Producto ingresado correctamente.

</div>



<div class="grid">

<!-- FORM -->

<div class="card">

<h2>

Ingreso de Insumos

</h2>

<br>

<form
th:action="@{/inventario/guardar}"
th:object="${item}"
method="post">

<div class="form-group">

<label>

Nombre del artículo

</label>

<input
type="text"
th:field="*{nombreItem}"
placeholder="Ej: Agua, Arroz"
required>

</div>


<div class="form-group">

<label>

Cantidad

</label>

<input
type="number"
th:field="*{cantidad}"
required>

</div>


<div class="form-group">

<label>

Categoría

</label>

<select
th:field="*{categoria}">

<option value="ALIMENTOS">

Alimentos

</option>

<option value="ABRIGO">

Abrigo

</option>

<option value="HIGIENE">

Higiene

</option>

<option value="OTROS">

Otros

</option>

</select>

</div>


<button type="submit">

Ingresar a Bodega

</button>

</form>

</div>



<!-- TABLA -->

<div class="card">

<h2>

📋 Stock Disponible

</h2>

<br>

<table>

<thead>

<tr>

<th>ID</th>

<th>Artículo</th>

<th>Cantidad</th>

<th>Categoría</th>

</tr>

</thead>

<tbody>

<tr
th:if="${#lists.isEmpty(listaProductos)}">

<td
colspan="4"
class="empty">

No hay productos registrados.

</td>

</tr>


<tr
th:each="i : ${listaProductos}">

<td
th:text="${i.id}">
</td>

<td
th:text="${i.nombreItem}">
</td>

<td
th:text="${i.cantidad}">
</td>

<td>

<span

th:classappend="
${i.categoria=='ALIMENTOS'}
? 'badge alimentos'
:
${i.categoria=='ABRIGO'}
? 'badge abrigo'
:
${i.categoria=='HIGIENE'}
? 'badge higiene'
:
'badge otros'

"

th:text="${i.categoria}">

</span>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</body>

</html>
```
