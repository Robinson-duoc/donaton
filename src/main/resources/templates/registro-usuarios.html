<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro de Donantes - Donatón</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; margin-bottom: 15px; }
        .exito { color: green; margin-bottom: 15px; }
        table { width: 100%; margin-top: 30px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎁 Registro de Donantes - Donatón</h2>
    
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${param.exito}" class="exito">¡Usuario registrado con éxito en la Donatón!</div>

    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
        <div class="form-group">
            <label>Nombre:</label>
            <input type="text" th:field="*{nombre}" required />
        </div>
        <div class="form-group">
            <label>Correo Electrónico:</label>
            <input type="email" th:field="*{email}" required />
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" th:field="*{password}" required />
        </div>
        <button type="submit">Registrar Usuario</button>
    </form>

    <h3>👥 Donantes Registrados</h3>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${listaUsuarios}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.rol}"></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
