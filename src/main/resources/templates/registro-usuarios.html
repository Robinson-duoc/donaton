<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro de Usuarios | Donatón</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f7fa;
padding:40px;
}

/* CONTENEDOR */

.container{

max-width:1000px;

margin:auto;

background:white;

border-radius:16px;

padding:35px;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

}

/* HEADER */

.top{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}

.top h2{

color:#0a3d62;

}

.volver{

text-decoration:none;

background:#0a3d62;

color:white;

padding:10px 18px;

border-radius:8px;

}

/* MENSAJES */

.error{

background:#ffdcdc;

color:#c0392b;

padding:12px;

border-radius:8px;

margin-bottom:20px;

}

.exito{

background:#dff9e6;

color:#27ae60;

padding:12px;

border-radius:8px;

margin-bottom:20px;

}

/* FORM */

.form-grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

}

.form-group{

display:flex;

flex-direction:column;

}

label{

margin-bottom:8px;

font-weight:bold;

}

input,
select{

padding:12px;

border:1px solid #ccc;

border-radius:8px;

}

.full{

grid-column:span 2;

}

button{

margin-top:25px;

background:#28a745;

color:white;

border:none;

padding:14px;

border-radius:8px;

cursor:pointer;

font-size:16px;

width:100%;

}

button:hover{

background:#219150;

}

/* TABLA */

table{

width:100%;

margin-top:40px;

border-collapse:collapse;

}

th{

background:#0a3d62;

color:white;

}

th,td{

padding:14px;

border-bottom:1px solid #ddd;

text-align:center;

}

tr:hover{

background:#fafafa;

}

/* RESPONSIVE */

@media(max-width:700px){

.form-grid{

grid-template-columns:1fr;

}

.full{

grid-column:span 1;

}

.top{

flex-direction:column;

gap:15px;

}

}

</style>
</head>

<body>

<div class="container">

<div class="top">

<h2>👤 Registro de Usuarios - Donatón</h2>

<a href="/" class="volver">
← Inicio
</a>

</div>


<div
th:if="${error}"
class="error"
th:text="${error}">
</div>


<div
th:if="${param.exito}"
class="exito">

✅ Usuario registrado correctamente.

</div>


<form
th:action="@{/usuarios/guardar}"
th:object="${usuario}"
method="post">

<div class="form-grid">

<div class="form-group">

<label>Nombre Completo</label>

<input
type="text"
th:field="*{nombre}"
placeholder="Ingrese nombre"
required>

</div>


<div class="form-group">

<label>Correo Electrónico</label>

<input
type="email"
th:field="*{email}"
placeholder="correo@ejemplo.com"
required>

</div>


<div class="form-group">

<label>Contraseña</label>

<input
type="password"
th:field="*{password}"
placeholder="********"
required>

</div>


<div class="form-group">

<label>Rol</label>

<select th:field="*{rol}">

<option value="DONANTE">
Donante
</option>

<option value="ADMIN">
Administrador
</option>

<option value="VOLUNTARIO">
Voluntario
</option>

</select>

</div>


<div class="form-group full">

<button type="submit">

Registrar Usuario

</button>

</div>

</div>

</form>



<h2 style="margin-top:45px;color:#0a3d62;">

👥 Usuarios Registrados

</h2>

<table>

<thead>

<tr>

<th>ID</th>
<th>Nombre</th>
<th>Email</th>
<th>Rol</th>

</tr>

</thead>

<tbody>

<tr
th:each="u : ${listaUsuarios}">

<td th:text="${u.id}"></td>

<td th:text="${u.nombre}"></td>

<td th:text="${u.email}"></td>

<td th:text="${u.rol}"></td>

</tr>

</tbody>

</table>

</div>

</body>
</html>
