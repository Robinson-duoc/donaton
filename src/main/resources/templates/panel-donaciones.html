<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Donaciones - Donatón</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 700px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .marcador { background-color: #007bff; color: white; text-align: center; padding: 20px; border-radius: 6px; margin-bottom: 25px; }
        .marcador h1 { margin: 5px 0; font-size: 2.5em; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 95%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 1.1em; width: 100%; }
        .error { color: red; margin-bottom: 15px; font-weight: bold; }
        .exito { color: green; margin-bottom: 15px; font-weight: bold; }
        table { width: 100%; margin-top: 30px; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="marcador">
        <h3>💰 TOTAL RECAUDADO</h3>
        <h1>$<span th:text="${totalRecaudado}">0.0</span></h1>
    </div>

    <h2>❤️ Realizar una Donación</h2>
    
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${param.exito}" class="exito">¡Gracias! Tu donación ha sido procesada con éxito.</div>

    <form th:action="@{/donaciones/enviar}" th:object="${donacion}" method="post">
        <div class="form-group">
            <label>ID de tu Usuario (Míralo en la lista de usuarios):</label>
            <input type="number" th:field="*{usuarioId}" placeholder="Ej: 1" required />
        </div>
        <div class="form-group">
            <label>Monto a Donar ($):</label>
            <input type="number" step="0.01" th:field="*{monto}" placeholder="Ej: 5000" required />
        </div>
        <button type="submit">Confirmar Donación</button>
    </form>

    <h3>📋 Últimos Aportes</h3>
    <table>
        <thead>
            <tr>
                <th>ID Donación</th>
                <th>ID Usuario</th>
                <th>Monto</th>
                <th>Fecha/Hora</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="d : ${listaDonaciones}">
                <td th:text="${d.id}"></td>
                <td th:text="${d.usuarioId}"></td>
                <td th:text="${'$' + d.monto}"></td>
                <td th:text="${#temporals.format(d.fechaDonacion, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${d.estado}" style="font-weight: bold; color: #28a745;"></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
