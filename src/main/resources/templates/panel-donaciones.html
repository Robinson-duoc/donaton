```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Donatón | Panel de Donaciones</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
padding:40px;
}

/* CONTENEDOR */

.container{

max-width:1200px;

margin:auto;

}

/* HEADER */

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:35px;

}

.header h1{

color:#0a3d62;

}

.volver{

background:#0a3d62;

color:white;

padding:12px 20px;

text-decoration:none;

border-radius:10px;

}

/* TOTAL */

.marcador{

background:
linear-gradient(
135deg,
#0a3d62,
#1d6fa5
);

color:white;

padding:40px;

border-radius:20px;

margin-bottom:35px;

box-shadow:
0 12px 30px rgba(0,0,0,.1);

text-align:center;

}

.marcador h3{

opacity:.9;

margin-bottom:10px;

}

.marcador h1{

font-size:58px;

}

/* GRID */

.grid{

display:grid;

grid-template-columns:
1fr 1.4fr;

gap:25px;

}

.card{

background:white;

padding:30px;

border-radius:18px;

box-shadow:
0 8px 25px rgba(0,0,0,.08);

}

/* FORM */

.form-group{

margin-bottom:20px;

}

label{

display:block;

margin-bottom:8px;

font-weight:bold;

}

input{

width:100%;

padding:14px;

border:1px solid #d8d8d8;

border-radius:10px;

}

button{

width:100%;

padding:16px;

border:none;

border-radius:10px;

background:#28a745;

color:white;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#22963c;

}

.error{

padding:12px;

background:#ffe3e3;

color:#d63031;

border-radius:10px;

margin-bottom:20px;

}

.exito{

padding:12px;

background:#dff9e6;

color:#27ae60;

border-radius:10px;

margin-bottom:20px;

}

/* TABLA */

table{

width:100%;

border-collapse:collapse;

}

th{

background:#0a3d62;

color:white;

}

th,td{

padding:14px;

text-align:center;

border-bottom:1px solid #eee;

}

tr:hover{

background:#fafafa;

}

.estado{

background:#d4edda;

color:#155724;

padding:8px 12px;

border-radius:20px;

font-weight:bold;

display:inline-block;

}

@media(max-width:900px){

.grid{

grid-template-columns:1fr;

}

.marcador h1{

font-size:40px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
❤️ Panel de Donaciones
</h1>

<a
th:href="@{/}"
class="volver">

← Inicio

</a>

</div>


<div class="marcador">

<h3>

TOTAL RECAUDADO

</h3>

<h1>

$
<span
th:text="${totalRecaudado}">
0
</span>

</h1>

</div>



<div class="grid">


<!-- FORM -->

<div class="card">

<h2>

Realizar Donación

</h2>

<br>

<div
th:if="${error}"
class="error"
th:text="${error}">
</div>

<div
th:if="${param.exito}"
class="exito">

✅ Gracias por donar.

</div>


<form
th:action="@{/donaciones/enviar}"
th:object="${donacion}"
method="post">

<div class="form-group">

<label>

ID Usuario

</label>

<input
type="number"
th:field="*{usuarioId}"
required>

</div>


<div class="form-group">

<label>

Monto

</label>

<input
type="number"
step="0.01"
th:field="*{monto}"
required>

</div>


<button type="submit">

Confirmar Donación

</button>

</form>

</div>



<!-- TABLA -->

<div class="card">

<h2>

📋 Últimas Donaciones

</h2>

<br>

<table>

<thead>

<tr>

<th>ID</th>

<th>Usuario</th>

<th>Monto</th>

<th>Fecha</th>

<th>Estado</th>

</tr>

</thead>

<tbody>

<tr
th:each="d : ${listaDonaciones}">

<td
th:text="${d.id}">
</td>

<td
th:text="${d.usuarioId}">
</td>

<td
th:text="${'$'+d.monto}">
</td>

<td
th:text="${#temporals.format(d.fechaDonacion,'dd/MM/yyyy HH:mm')}">
</td>

<td>

<span
class="estado"
th:text="${d.estado}">
</span>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</body>

</html>
```
