<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Usuarios | Donatón</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

body{
background:#f5f7fa;
}

.header{

background:#0a3d62;

padding:18px;

color:white;

margin-bottom:35px;

}

.card{

border:none;

border-radius:16px;

}

.card-header{

border-radius:16px 16px 0 0 !important;

}

.table td,
.table th{

vertical-align:middle;

}

.btn-donaton{

background:#28a745;

color:white;

}

.btn-donaton:hover{

background:#23913d;

color:white;

}

.badge-admin{

background:#dc3545;

}

.badge-donante{

background:#0dcaf0;

color:black;

}

.badge-voluntario{

background:#ffc107;

color:black;

}

</style>

</head>

<body>

<div class="header">

<div class="container d-flex justify-content-between">

<h2>👥 Gestión de Usuarios - Donatón</h2>

<a
href="/"
class="btn btn-light">

← Inicio

</a>

</div>

</div>


<div class="container">

<div
th:if="${param.error}"
class="alert alert-danger"
th:text="${param.error}">
</div>

<div
th:if="${param.exito}"
class="alert alert-success">

✅ Usuario registrado correctamente.

</div>


<div class="row g-4">

<!-- FORM -->

<div class="col-lg-4">

<div class="card shadow">

<div
class="card-header bg-primary text-white">

Nuevo Usuario

</div>

<div class="card-body">

<form
th:action="@{/usuarios/crear}"
th:object="${usuario}"
method="post">

<div class="mb-3">

<label class="form-label">
Nombre
</label>

<input
type="text"
class="form-control"
th:field="*{nombre}"
required>

</div>


<div class="mb-3">

<label class="form-label">

Correo

</label>

<input
type="email"
class="form-control"
th:field="*{email}"
required>

</div>


<div class="mb-3">

<label class="form-label">

Contraseña

</label>

<input
type="password"
class="form-control"
th:field="*{password}"
required>

</div>


<div class="mb-3">

<label class="form-label">

Rol

</label>

<select
class="form-select"
th:field="*{rol}">

<option value="DONANTE">
Donante
</option>

<option value="VOLUNTARIO">
Voluntario
</option>

<option value="ADMINISTRADOR">
Administrador
</option>

</select>

</div>


<button
class="btn btn-donaton w-100"
type="submit">

Registrar Usuario

</button>

</form>

</div>

</div>

</div>


<!-- TABLA -->

<div class="col-lg-8">

<div class="card shadow">

<div
class="card-header bg-dark text-white">

Usuarios Registrados

</div>

<div class="card-body">

<div class="table-responsive">

<table class="table table-hover">

<thead>

<tr>

<th>ID</th>

<th>Nombre</th>

<th>Email</th>

<th>Rol</th>

</tr>

</thead>

<tbody>

<tr th:if="${#lists.isEmpty(usuarios)}">

<td
colspan="4"
class="text-center text-muted">

No existen usuarios registrados.

</td>

</tr>


<tr
th:each="u : ${usuarios}">

<td
th:text="${u.id}">
</td>

<td
th:text="${u.nombre}">
</td>

<td
th:text="${u.email}">
</td>


<td>

<span
th:if="${u.rol=='ADMINISTRADOR'}"
class="badge badge-admin"
th:text="${u.rol}">
</span>

<span
th:if="${u.rol=='DONANTE'}"
class="badge badge-donante"
th:text="${u.rol}">
</span>

<span
th:if="${u.rol=='VOLUNTARIO'}"
class="badge badge-voluntario"
th:text="${u.rol}">
</span>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

</div>

</div>

</body>

</html>
